name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            gtk4 \
            gtk4-layer-shell \
            pkgconf \
            rustup
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Run checks
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: |
          cargo build --locked --release
          strip target/release/layer-shell-rs

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/layer-shell-rs-${GITHUB_REF_NAME:-manual}-x86_64-unknown-linux-gnu.tar.gz layer-shell-rs
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer-shell-rs-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
